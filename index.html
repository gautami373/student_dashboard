<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="sidebar">
      <h2>StudentHub</h2>

        <li>Home</li>
        <li>Tasks</li>

        <li>Settings</li>

    <div class="main-content">

      <h1 id="welcome-msg">Welcome Student 👋</h1>

        <ul>
          <li>Complete CN chapter</li>
          <li>Practice JavaScript</li>
          <li>Drink water and survive engineering</li>
        </ul>

    </div>

  </div>

</html>
